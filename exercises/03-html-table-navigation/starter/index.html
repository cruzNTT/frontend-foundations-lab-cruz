<!doctype html>
<html
  lang="es"
  data-exercise-id="03-html-table-navigation"
  data-exercise-title="03 · Tabla de datos y navegacion"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter · Tabla de datos</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/shared/exercise-shell.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="/shared/exercise-nav.mjs"></script>
  </head>
  <body>
    <a href="#main" class="skip">Skip to main content</a>
    <main class="container exercise-shell">
      <section class="exercise-intro card">
        <h1>Inventario</h1>
        <p>Convierte este listado visual en una tabla de datos accesible.</p>
      </section>

      <section class="card">
        <div class="data-grid">
          <table>
            <caption hidden>
              Inventario
            </caption>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Categoria</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Accion</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Teclado mecanico</td>
                <td>Perifericos</td>
                <td>18</td>
                <td>
                  <span class="status status--ok" aria-label="ok">●</span>
                </td>
                <td>Editar</td>
              </tr>
              <tr>
                <td>Monitor 27 pulgadas</td>
                <td>Monitores</td>
                <td>2</td>
                <td>
                  <span class="status status--warning" aria-label="warning"
                    >●</span
                  >
                </td>
                <td>Editar</td>
              </tr>
              <tr>
                <td>Webcam Full HD</td>
                <td>Video</td>
                <td>0</td>
                <td>
                  <span class="status status--danger" aria-label="danger"
                    >●</span
                  >
                </td>
                <td>Editar</td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
