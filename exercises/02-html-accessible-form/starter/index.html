<!doctype html>
<html
  lang="es"
  data-exercise-id="02-html-accessible-form"
  data-exercise-title="02 · Formulario accesible"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter · Formulario accesible</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/shared/exercise-shell.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="/shared/exercise-nav.mjs"></script>
  </head>
  <body>
    <main class="container exercise-shell">
      <section class="exercise-intro card">
        <p>HTML y accesibilidad</p>
        <h1>Alta en el programa de formacion</h1>
        <p class="todo-note">
          Completa la semantica, tipos, restricciones, ayudas y agrupaciones del
          formulario.
        </p>
      </section>
      <section class="exercise-workspace card">
        <form class="registration-form" action="#success" method="get">
          <div class="field">
            <label for="fullName">Nombre completo</label>
            <input
              id="fullName"
              name="fullName"
              placeholder="Ej. Andrea Garcia"
            />
          </div>
          <div class="field">
            <label for="email">Correo corporativo</label>
            <input id="email" name="email" placeholder="nombre@empresa.com" />
            <p class="field__hint">
              Usaremos esta direccion para las convocatorias.
            </p>
          </div>
          <div class="field">
            <label for="startDate">Fecha de incorporacion</label>
            <input id="startDate" name="startDate" placeholder="dd/mm/aaaa"/>
          </div>
          <div class="field">
            <label for="experience">Nivel de experiencia</label>
            <select id="experience" name="experience">
              <option>Selecciona</option>
              <option>Sin experiencia</option>
              <option>Menos de un año</option>
              <option>Uno a tres años</option>
            </select>
          </div>
          <div class="options">
            <p>Disponibilidad preferida</p>
            <div>
              <input type="radio" name="schedule" value="morning" id="morning"/>
              <label for="morning">Mañana</label>
            </div>
            <div>
              <input type="radio" name="schedule" value="afternoon" id="afternoon"/>
              <label for="afternoon">Tarde</label>
            </div>
          </div>
          <div class="options">
            <div>
              <input type="checkbox" name="terms" id="terms" required/>
              <label for="terms">Acepto las normas del programa</label>
            </div>
          </div>
          <button type="submit">Enviar solicitud</button>
        </form>
      </section>
    </main>
  </body>
</html>
