<!doctype html>
<html
  lang="es"
  data-exercise-id="02-html-accessible-form"
  data-exercise-title="02 · Formulario accesible"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter · Formulario accesible</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/shared/exercise-shell.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="/shared/exercise-nav.mjs"></script>
  </head>
  <body>
    <main class="container exercise-shell">
      <section class="exercise-intro card">
        <p>HTML y accesibilidad</p>
        <h1>Alta en el programa de formacion</h1>
        <p class="todo-note">
          Completa la semantica, tipos, restricciones, ayudas y agrupaciones del
          formulario.
        </p>
      </section>
      <section class="exercise-workspace card">
        <form class="registration-form" action="#success" method="get">
          <div class="field">
            <label for="fullName">Nombre completo <span class="mandatory">*</span></label>
            <input
              id="fullName"
              name="fullName"
              placeholder="Ej. Andrea Garcia"
              minlength="8"
              autocomplete="name"
              required
              aria-required="true"
              required=""
            />
          </div>
          <div class="field">
            <label for="email">Correo corporativo <span class="mandatory">*</span></label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="nombre@empresa.com"
              required
              aria-describedby="alternativeText"
            />
            <p id="alternativeText" class="field__hint">
              Usaremos esta direccion para las convocatorias.
            </p>
          </div>
          <div class="field">
            <label for="startDate">Fecha de incorporacion</label>
            <input id="startDate" name="startDate" type="date" placeholder="dd/mm/aaaa" min="2008-10-22" required />
          </div>
          <div class="field">
            <label for="experience">Nivel de experiencia</label>
            <select id="experience" name="experience">
              <option value="Select">Selecciona</option>
              <option value="noExperience">Sin experiencia</option>
              <option value="lessOneYear">Menos de un año</option>
              <option value="oneThreeYears">Uno a tres años</option>
            </select>
          </div>
        </form>
        <br>
        <form class="options">
            <p>Disponibilidad preferida</p>
          <label
            ><input type="radio" name="schedule" value="morning" />
            Mañana</label
          >
          <label
            ><input type="radio" name="schedule" value="afternoon" />
            Tarde</label
          >
        </form>
        <br>
        <form class="options">
            <div>
             <label><input type="checkbox" name="terms" id="terms" required>Acepto las normas del programa</label>
            </div>
        </form>
        <br>
        <button type="submit">Enviar solicitud</div>
      </section>
    </main>
  </body>
</html>
